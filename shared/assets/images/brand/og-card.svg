<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<!--
  @symbol: The ship's link-preview card (Open Graph og:image and the
  twitter:card "summary_large_image" picture), 1200 by 630 pixels.
  @concept: No new identity. Three pieces already on board are reused:
  the favicon mark (en/favicon.svg, ro/favicon.svg), the header wordmark
  exactly as .logo a renders it (Space Grotesk 700, uppercase, 2px
  tracking at 17.6px, so 0.114em, magenta glow of .logo a:hover), and the
  theme background #0a0b1e from site.webmanifest.
  @reason: Link-preview scrapers (Facebook, LinkedIn, X, Slack, WhatsApp)
  refuse SVG for og:image; they want a raster file at an absolute URL.
  This SVG is the master, og-card.png is what the pages point at.
  @warning: The letters are outlined into paths on purpose. Text in an SVG
  is drawn with whatever font the machine has; Space Grotesk is a web font
  the renderer does not have, so the wordmark would silently change shape.
  Outlined, the master renders the same on every machine.
  Outlines made with fontTools 4 from SpaceGrotesk[wght].ttf (google/fonts,
  ofl/spacegrotesk, SIL OFL 1.1, instanced at wght 700, sha256 acad6de1...)
  and, for the mark's D, Liberation Sans Bold, the metric twin of the
  favicon's Arial bold.
  @layout: The mark and the wordmark are stacked and centred. Messaging
  apps crop the card to a centre square (x 285 to 915); everything here
  sits inside x 300 to 903, so the square crop loses nothing.
  @pedagogy: Rebuild the PNG from this master with librsvg:
    rsvg-convert -w 1200 -h 630 og-card.svg -o og-card.png
-->
  <defs>
    <filter id="glow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="9" />
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#0a0b1e" />
  <g transform="translate(460 113.8) scale(2.8)">
