name: Lint

# @reason: A one-time fix decays the moment the next page is written.
#   This workflow re-checks the repository's standing frontend rules on
#   every push and pull request, so a regression is caught in review
#   rather than in production.
#
#   It deliberately does NOT gate deploy.yml: the two workflows are kept
#   independent so a lint failure never blocks an urgent content publish,
#   and so neither file has to be edited when the other changes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  noopener:
    name: 'target="_blank" carries rel="noopener noreferrer"'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # @bridge: tools/check-noopener.py — see tools/README.md for the
      #   tab-nabbing threat this rule defends against.
      # @reason: no setup-python step is needed. The checker is pure
      #   standard-library Python 3 with no dependencies, and every
      #   ubuntu-latest runner ships python3 already.

      - name: Prove the checker still detects known violations
        # @warning: run the self-test FIRST. A checker that has silently
        #   stopped matching would otherwise report a cheerful "OK" over a
        #   broken site — a green tick that means nothing. This step fails
        #   if any planted fixture violation goes undetected.
        run: python3 tools/check-noopener.py --self-test

      - name: Scan the site for unprotected new-tab links
        run: python3 tools/check-noopener.py

  under-construction:
    name: 'no log page shows filler or empty content undeclared'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # @bridge: tools/check-uc-banner.py enforces BACKLOG-EN.md #008,
      #   completion condition 3. tools/add-uc-banner.py is the companion
      #   that writes the banners in; this job only judges.
      # @reason: The site ships 46 log decks whose entries are still
      #   placeholder prose. That is acceptable — an unfinished ship that
      #   says so is honest. What is NOT acceptable is a deck that renders
      #   filler or emptiness while looking finished. This job is the line
      #   between the two, and it must hold for every newly generated page,
      #   not just the ones that existed when the rule was written.

      - name: Every filler or empty log deck declares itself under construction
        run: python3 tools/check-uc-banner.py
