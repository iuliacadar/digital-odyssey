name: Deploy to GitHub Pages

# One-command deploy: `git push origin main` (or `gh workflow run deploy.yml`)
# triggers this workflow, which publishes the repository root as-is —
# there is no build step, this is a static HTML/CSS/JS site.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy in flight at a time; never cancel one that's already
# uploading/publishing so we never ship a half-published artifact.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the whole repo root: en/ and ro/ are served as sibling
          # sites (see BACKLOG-EN.md #008 — option 3, en/ is canonical).
          # @warning: this workflow excludes NOTHING. `path: '.'` hands the
          #   whole checkout to the action, whose own tar step skips only
          #   `.git/` and `.github/`. Everything else is reachable on the
          #   live site: docs/, tools/, the Makefile and the Markdown
          #   sources (BACKLOG-*.md, JOURNAL-*.md, DEPLOY.md, CLAUDE.md...).
          #   An earlier version of this comment said docs/, tools/ and the
          #   Markdown were left out "to avoid publishing internal working
          #   notes"; they never were (audit 2026-11-04, F10).
          # @reason: that is acceptable, and partly required:
          #   - the repository is public, so the artifact reveals nothing
          #     a visitor could not already read on GitHub;
          #   - Pages only serves files, it executes nothing server-side,
          #     so a published .py or Makefile is text, not an attack surface;
          #   - the vault (script.js, JOURNAL_PATH) fetches ../JOURNAL-EN.md
          #     and ../JOURNAL-RO.md from the live site at run time, so the
          #     journals MUST be published.
          #   If the site ever needs to hide something, the fix is a staged
          #   `_site/` directory that copies what is served (journals
          #   included), not a comment that promises an exclusion.
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
